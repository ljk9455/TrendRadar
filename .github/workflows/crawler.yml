name: Get Hot News

on:
  schedule:
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    # ⚠️ 试用版说明 / Trial Mode
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    #
    # 🔄 运行机制 / How it works:
    #    - 每个周期为 7 天，届时自动停止
    #    - 运行 "Check In" 会重置周期（重新开始 7 天倒计时，而非累加）
    #    - Each cycle is 7 days, then auto-stops
    #    - "Check In" resets the cycle (restarts 7-day countdown, not cumulative)
    #
    # 💡 设计初衷 / Why this design:
    #    如果 7 天都忘了签到，或许这些资讯对你来说并非刚需
    #    适时的暂停，能帮你从信息流中抽离，给大脑留出喘息的空间
    #    If you forget for 7 days, maybe you don't really need it
    #    A timely pause helps you detach from the stream and gives your mind space
    #
    # 🙏 珍惜资源 / Respect shared resources:
    #    GitHub Actions 是平台提供的公共资源，每次运行都会消耗算力
    #    签到机制确保资源分配给真正需要的用户，感谢你的理解与配合
    #    GitHub Actions is a shared public resource provided by the platform
    #    Check-in ensures resources go to those who truly need it — thank you
    #
    # 🚀 长期使用请部署 Docker 版本 / For long-term use, deploy Docker version
    #
    # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
    #
    # 📝 修改运行时间：只改第一个数字（0-59），表示每小时第几分钟运行
    # 📝 Change time: Only modify the first number (0-59) = minute of each hour
    #
    # 示例 / Examples:
    #   "15 * * * *"     → 每小时第15分钟 / minute 15 every hour
    #   "30 0-14 * * *"  → 北京时间 8:00-22:00 每小时第30分钟 / Beijing 8am-10pm
    #
    - cron: "33 * * * *"

  workflow_dispatch:

concurrency:
  group: crawler-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          clean: true

      - name: Check Expiration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          WORKFLOW_FILE="crawler.yml"
          API_URL="repos/${{ github.repository }}/actions/workflows/$WORKFLOW_FILE/runs"

          TOTAL=$(gh api "$API_URL" --jq '.total_count')
          if [ -z "$TOTAL" ] || [ "$TOTAL" -eq 0 ]; then
            echo "No previous runs found, skipping expiration check"
            exit 0
          fi

          LAST_PAGE=$(( (TOTAL + 99) / 100 ))
          FIRST_RUN_DATE=$(gh api "$API_URL?per_page=100&page=$LAST_PAGE" --jq '.workflow_runs[-1].created_at')

          if [ -n "$FIRST_RUN_DATE" ]; then
            CURRENT_TIMESTAMP=$(date +%s)
            FIRST_RUN_TIMESTAMP=$(date -d "$FIRST_RUN_DATE" +%s)
            DIFF_SECONDS=$((CURRENT_TIMESTAMP - FIRST_RUN_TIMESTAMP))
            LIMIT_SECONDS=604800

            if [ $DIFF_SECONDS -gt $LIMIT_SECONDS ]; then
              echo "⚠️ 试用期已结束，请运行 'Check In' 签到续期"
              echo "⚠️ Trial expired. Run 'Check In' to renew."
              gh workflow disable "$WORKFLOW_FILE"
              exit 1
            else
              DAYS_LEFT=$(( (LIMIT_SECONDS - DIFF_SECONDS) / 86400 ))
              echo "✅ 试用期剩余 ${DAYS_LEFT} 天，到期前请运行 'Check In' 签到续期"
              echo "✅ Trial: ${DAYS_LEFT} days left. Run 'Check In' before expiry to renew."
            fi
          fi

      - name: Set up Python
        if: success()
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        if: success()
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        if: success()
        run: uv sync --frozen --no-dev

      - name: Verify required files
        if: success()
        run: |
          if [ ! -f config/config.yaml ]; then
            echo "Error: Config missing"
            exit 1
          fi

      # ★ 启动本地 webhook 截获服务（情报中枢本地拉取方案）
      - name: Start webhook capture server
        if: success()
        run: |
          cat > /tmp/webhook_capture.py << 'PYEOF'
          import http.server, json, os, threading, time
          from datetime import datetime, timezone

          CAPTURE_DIR = "webhook_payloads"
          os.makedirs(CAPTURE_DIR, exist_ok=True)
          counter = 0

          class CaptureHandler(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  global counter
                  length = int(self.headers.get("Content-Length", 0))
                  body = self.rfile.read(length) if length > 0 else b""
                  try:
                      payload = json.loads(body) if body else {}
                  except:
                      payload = {"raw": body.decode("utf-8", errors="replace")}

                  counter += 1
                  ts = datetime.now(timezone.utc).strftime("%Y%m%d_%H%M%S")
                  filename = f"{CAPTURE_DIR}/payload_{ts}_{counter:03d}.json"
                  with open(filename, "w", encoding="utf-8") as f:
                      json.dump({
                          "captured_at": datetime.now(timezone.utc).isoformat(),
                          "batch_index": counter,
                          **payload
                      }, f, ensure_ascii=False, indent=2)
                  print(f"[Capture] Saved {filename} ({length} bytes)")

                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.end_headers()
                  self.wfile.write(b'{"ok":true}')

              def log_message(self, format, *args):
                  pass

          server = http.server.HTTPServer(("127.0.0.1", 18888), CaptureHandler)
          print(f"[Capture] Listening on 127.0.0.1:18888")

          thread = threading.Thread(target=server.serve_forever, daemon=True)
          thread.start()

          while True:
              time.sleep(60)
          PYEOF
          python3 /tmp/webhook_capture.py &
          sleep 1
          echo "Webhook capture server started on :18888"

      # ★ 运行爬虫（GENERIC_WEBHOOK_URL 指向本地截获服务）
      - name: Run crawler
        if: success()
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
          WEWORK_WEBHOOK_URL: ${{ secrets.WEWORK_WEBHOOK_URL }}
          WEWORK_MSG_TYPE: ${{ secrets.WEWORK_MSG_TYPE }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_SMTP_SERVER: ${{ secrets.EMAIL_SMTP_SERVER }}
          EMAIL_SMTP_PORT: ${{ secrets.EMAIL_SMTP_PORT }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER_URL: ${{ secrets.NTFY_SERVER_URL }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          BARK_URL: ${{ secrets.BARK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          # ★ 通用Webhook → 指向本地截获服务
          GENERIC_WEBHOOK_URL: "http://127.0.0.1:18888"
          GENERIC_WEBHOOK_TEMPLATE: '{"title":"{title}","content":"{content}","source":"trendradar"}'
          # AI 配置
          AI_ANALYSIS_ENABLED: ${{ secrets.AI_ANALYSIS_ENABLED }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_API_BASE: ${{ secrets.AI_API_BASE }}
          # 远程存储配置
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
          S3_REGION: ${{ secrets.S3_REGION }}
          GITHUB_ACTIONS: true
        run: uv run python -m trendradar

      # ★ 将截获的 webhook 数据提交到 data 分支
      - name: Commit captured data to data branch
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 检查是否有截获的数据
          if [ ! -d webhook_payloads ] || [ -z "$(ls webhook_payloads/*.json 2>/dev/null)" ]; then
            echo "No webhook payloads captured, skipping commit"
            exit 0
          fi

          FILE_COUNT=$(ls webhook_payloads/*.json | wc -l)
          echo "Captured $FILE_COUNT payload file(s)"

          # 保存截获的文件到临时目录
          cp -r webhook_payloads /tmp/webhook_payloads_backup

          # 配置 git
          git config user.name "TrendRadar Bot"
          git config user.email "trendradar-bot@users.noreply.github.com"

          # 尝试切换到已有的 data 分支，如果不存在则创建孤立分支
          git fetch origin data 2>/dev/null && git checkout data || {
            echo "Creating new orphan branch: data"
            git checkout --orphan data
            git rm -rf . 2>/dev/null || true
          }

          # 清理旧的 payload 文件（每次只保留最新一批）
          rm -rf webhook_payloads
          mkdir -p webhook_payloads

          # 从备份恢复截获的文件
          cp /tmp/webhook_payloads_backup/*.json webhook_payloads/

          # 写入元数据
          echo "{\"updated_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\", \"file_count\": $FILE_COUNT}" > webhook_payloads/meta.json

          # 提交并推送
          git add webhook_payloads/
          git commit -m "auto: captured $FILE_COUNT payloads at $(date -u +%Y-%m-%dT%H:%M:%SZ)" || {
            echo "Nothing to commit"
            exit 0
          }
          git push origin data --force
          echo "✅ Pushed $FILE_COUNT payload(s) to data branch"
